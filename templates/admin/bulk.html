{% extends "admin/base.html" %}
{% block content %}
<div class="max-w-4xl mx-auto pb-20">
    <div class="mb-10">
        <h2 class="text-3xl font-black text-gray-900 tracking-tight flex items-center gap-3">
            <i class="ph ph-stack text-purple-600"></i> Bulk Engine
        </h2>
        <p class="text-sm text-gray-500 font-medium mt-1">Generate high-resolution batches in a single ZIP package.</p>
    </div>

    <form id="bulkForm" method="POST" class="grid grid-cols-1 lg:grid-cols-3 gap-8">
        <div class="lg:col-span-2 space-y-6">
            <div class="bg-white p-8 rounded-[2rem] border border-gray-100 shadow-xl shadow-gray-200/50">
                <label class="block text-[10px] font-black text-gray-400 uppercase tracking-widest mb-4 ml-1">Paste Links (One per line)</label>
                <textarea name="urls" id="urlInput" rows="12" required 
                    placeholder="https://site1.com&#10;https://site2.com" 
                    class="w-full p-6 bg-gray-50 border border-gray-100 rounded-3xl outline-none font-mono text-sm leading-relaxed"></textarea>
            </div>
        </div>

        <div class="lg:col-span-1 space-y-6">
            <div class="bg-white p-6 rounded-[2rem] border border-gray-100 shadow-sm sticky top-6">
                <h3 class="font-black text-gray-900 mb-6 flex items-center gap-2 border-b pb-4">
                    <i class="ph ph-sliders-horizontal text-purple-500"></i> Batch Specs
                </h3>
                <div class="space-y-4">
                    <div>
                        <label class="block text-[10px] font-bold text-gray-400 uppercase mb-2">Dots Color</label>
                        <input type="color" name="fg_color" value="#000000" class="w-full h-12 rounded-xl cursor-pointer">
                    </div>
                    <label class="flex items-center gap-3 p-4 bg-gray-50 rounded-2xl cursor-pointer">
                        <input type="checkbox" name="is_transparent" class="w-5 h-5 text-purple-600 rounded">
                        <span class="text-xs font-bold text-gray-700">Transparent Background</span>
                    </label>
                    <div class="pt-6">
                        <button type="submit" class="w-full bg-black text-white py-5 rounded-2xl font-black shadow-2xl flex flex-col items-center gap-1">
                            <span class="flex items-center gap-2">Build ZIP Package <i class="ph ph-file-zip text-xl"></i></span>
                            <span class="text-[9px] opacity-50 uppercase tracking-widest">300 DPI • PNG</span>
                        </button>
                    </div>
                </div>
            </div>
        </div>
    </form>
</div>

<div id="progressOverlay" class="hidden fixed inset-0 bg-gray-900/90 backdrop-blur-md z-[100] flex items-center justify-center p-6">
    <div class="w-full max-w-sm text-center">
        <div class="mb-6 relative inline-block">
            <i class="ph ph-rocket-launch text-6xl text-purple-400 animate-bounce"></i>
            <div class="absolute -right-2 -top-2 w-4 h-4 bg-yellow-400 rounded-full animate-ping"></div>
        </div>
        <h3 class="text-2xl font-black text-white mb-2">Generating Batch...</h3>
        <p id="progressStatus" class="text-gray-400 text-xs font-bold uppercase tracking-widest mb-8">Processing your links</p>
        
        <div class="w-full h-2 bg-gray-800 rounded-full overflow-hidden">
            <div id="progressBar" class="h-full bg-purple-500 transition-all duration-300 ease-out" style="width: 0%"></div>
        </div>
        <p class="text-[10px] text-gray-500 mt-4 uppercase font-bold tracking-tighter">Your download will start automatically once finished</p>
    </div>
</div>

<script>
    document.getElementById('bulkForm').onsubmit = function(e) {
        const urls = document.getElementById('urlInput').value.split('\n').filter(u => u.trim());
        if (urls.length === 0) return false;

        const overlay = document.getElementById('progressOverlay');
        const bar = document.getElementById('progressBar');
        const status = document.getElementById('progressStatus');
        
        overlay.classList.remove('hidden');
        
        let progress = 0;
        const interval = setInterval(() => {
            progress += Math.random() * 15;
            if (progress >= 95) {
                progress = 95;
                status.innerText = "Finalizing ZIP Archive...";
                clearInterval(interval);
            }
            bar.style.width = progress + "%";
        }, 400);

        // Form will submit normally and trigger file download
        // We hide the overlay after a reasonable delay for the download to start
        setTimeout(() => {
            bar.style.width = "100%";
            status.innerText = "Download Ready!";
            setTimeout(() => { overlay.classList.add('hidden'); bar.style.width = "0%"; }, 2000);
        }, urls.length * 500 + 2000); 
    };
</script>
{% endblock %}
