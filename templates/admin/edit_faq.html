{% extends "admin/base.html" %}
{% block content %}
    <div class="max-w-3xl mx-auto">
        <div class="flex items-center gap-4 mb-8">
            <a href="{{ url_for('admin_faqs') }}" class="w-10 h-10 flex items-center justify-center rounded-full bg-white text-gray-400 hover:text-black hover:bg-gray-50 border border-gray-100 transition shadow-sm">
                <i class="ph ph-arrow-left text-xl"></i>
            </a>
            <div>
                <h2 class="text-2xl font-black text-gray-900 tracking-tight">Editor Console</h2>
                <p class="text-xs text-gray-500 font-medium">Update knowledge base entry #{{ faq.id }}</p>
            </div>
        </div>

        <div class="bg-white p-8 rounded-[2rem] shadow-xl border border-gray-100">
            <form method="POST" class="space-y-6" onsubmit="syncContent()">
                
                <div>
                    <label class="block text-[10px] font-black text-gray-400 uppercase tracking-widest mb-3">Question</label>
                    <input type="text" name="question" value="{{ faq.question }}" required 
                           class="w-full p-4 bg-gray-50 border border-gray-100 rounded-2xl focus:ring-2 focus:ring-black focus:bg-white focus:outline-none font-bold text-gray-900 transition placeholder-gray-300">
                </div>
                
                <div>
                    <label class="block text-[10px] font-black text-gray-400 uppercase tracking-widest mb-3">Answer (Rich Text)</label>
                    
                    <div class="border border-gray-200 rounded-2xl overflow-hidden focus-within:ring-2 focus-within:ring-blue-500/20 transition shadow-sm">
                        <div class="flex items-center gap-1 bg-gray-50/50 p-2 border-b border-gray-200 text-gray-600">
                            <button type="button" onclick="execCmd('bold')" title="Bold" class="p-2 rounded-lg hover:bg-white hover:shadow-sm hover:text-black transition">
                                <i class="ph ph-text-b"></i>
                            </button>
                            <button type="button" onclick="execCmd('italic')" title="Italic" class="p-2 rounded-lg hover:bg-white hover:shadow-sm hover:text-black transition">
                                <i class="ph ph-text-italic"></i>
                            </button>
                            <button type="button" onclick="execCmd('underline')" title="Underline" class="p-2 rounded-lg hover:bg-white hover:shadow-sm hover:text-black transition">
                                <i class="ph ph-text-underline"></i>
                            </button>
                            <div class="w-px h-4 bg-gray-300 mx-2"></div>
                            <button type="button" onclick="execCmd('insertUnorderedList')" title="Bullet List" class="p-2 rounded-lg hover:bg-white hover:shadow-sm hover:text-black transition">
                                <i class="ph ph-list-bullets"></i>
                            </button>
                            <button type="button" onclick="addLink()" title="Add Link" class="p-2 rounded-lg hover:bg-white hover:shadow-sm hover:text-blue-600 transition">
                                <i class="ph ph-link"></i>
                            </button>
                            <div class="flex-1"></div>
                            <button type="button" onclick="toggleSource()" class="px-3 py-1.5 rounded-lg bg-gray-200 text-gray-600 hover:bg-gray-300 hover:text-black transition flex items-center gap-2 text-[10px] font-bold uppercase tracking-wider">
                                <i class="ph ph-code"></i> Source
                            </button>
                        </div>

                        <div id="visualEditor" contenteditable="true" class="p-5 min-h-[160px] outline-none text-gray-600 leading-relaxed text-sm">
                            {{ faq.answer | safe }}
                        </div>
                        
                        <textarea id="htmlEditor" class="hidden w-full p-5 min-h-[160px] bg-gray-900 text-green-400 font-mono text-xs outline-none resize-y" oninput="syncVisual()">{{ faq.answer }}</textarea>
                        
                        <input type="hidden" name="answer" id="answerInput">
                    </div>
                    <p class="text-[10px] text-gray-400 mt-2 flex items-center gap-1">
                        <i class="ph ph-info"></i> Tip: Select text to apply formatting.
                    </p>
                </div>

                <div class="flex gap-4 pt-4 border-t border-gray-50">
                    <button type="submit" class="flex-1 bg-black text-white py-4 rounded-2xl font-black uppercase tracking-widest hover:bg-gray-800 transition shadow-lg">
                        Update Entry
                    </button>
                    <a href="{{ url_for('admin_faqs') }}" class="px-8 py-4 border border-gray-200 rounded-2xl text-gray-500 font-bold hover:bg-gray-50 hover:text-gray-900 transition">
                        Cancel
                    </a>
                </div>
            </form>
        </div>
    </div>

    <script>
        // Execute formatting commands
        function execCmd(command, value = null) {
            document.execCommand(command, false, value);
            document.getElementById('visualEditor').focus();
        }

        // Add Hyperlink Prompt
        function addLink() {
            const url = prompt("Enter the destination URL:", "https://");
            if (url) execCmd('createLink', url);
        }

        // Toggle between Visual and HTML Source
        function toggleSource() {
            const visual = document.getElementById('visualEditor');
            const html = document.getElementById('htmlEditor');
            
            if (html.classList.contains('hidden')) {
                // Switch to Code View
                html.value = visual.innerHTML;
                visual.classList.add('hidden');
                html.classList.remove('hidden');
                html.focus();
            } else {
                // Switch to Visual View
                visual.innerHTML = html.value;
                html.classList.add('hidden');
                visual.classList.remove('hidden');
                visual.focus();
            }
        }
        
        // Keep Visual updated if typing in Code view
        function syncVisual() {
            document.getElementById('visualEditor').innerHTML = document.getElementById('htmlEditor').value;
        }

        // Final sync before submit to ensure backend gets the data
        function syncContent() {
            const visual = document.getElementById('visualEditor');
            const html = document.getElementById('htmlEditor');
            const input = document.getElementById('answerInput');
            
            // If we are in code view, use that value, otherwise use visual HTML
            if (!html.classList.contains('hidden')) {
                input.value = html.value;
            } else {
                input.value = visual.innerHTML;
            }
        }
    </script>
{% endblock %}
