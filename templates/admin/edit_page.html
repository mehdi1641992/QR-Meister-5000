{% extends "admin/base.html" %}
{% block title %}Edit {{ page.title }}{% endblock %}

{% block content %}
<div class="max-w-5xl mx-auto">
    <div class="flex items-center gap-4 mb-8">
        <a href="{{ url_for('admin_pages') }}" class="w-10 h-10 rounded-full bg-white border border-gray-200 flex items-center justify-center text-gray-500 hover:text-blue-600 transition shadow-sm">
            <i class="ph ph-arrow-left"></i>
        </a>
        <div>
            <h1 class="text-2xl font-bold text-gray-800">Editing: <span class="text-blue-600">{{ page.title }}</span></h1>
            <p class="text-xs text-gray-400 font-medium uppercase tracking-widest mt-1">Slug: /{{ page.slug }}</p>
        </div>
    </div>

    <div class="bg-white rounded-3xl shadow-xl border border-gray-100 overflow-hidden">
        <form method="POST" id="pageForm" class="flex flex-col h-full">
            
            <div class="p-8 border-b border-gray-100 bg-gray-50/50">
                <label class="block text-[10px] font-black uppercase tracking-[0.2em] text-gray-400 mb-3">Page Title</label>
                <input type="text" name="title" value="{{ page.title }}" class="w-full p-4 bg-white border border-gray-200 rounded-xl font-bold text-gray-800 focus:outline-none focus:ring-2 focus:ring-blue-500 transition shadow-sm placeholder-gray-300" placeholder="e.g. Terms of Service">
            </div>

            <div class="px-6 py-3 bg-white border-b border-gray-100 flex flex-wrap items-center gap-2 sticky top-0 z-20">
                <div class="flex items-center gap-1 p-1 bg-gray-50 rounded-lg border border-gray-100">
                    <button type="button" onclick="formatDoc('bold')" class="w-8 h-8 flex items-center justify-center rounded-md hover:bg-white hover:shadow-sm text-gray-600 transition" title="Bold">
                        <i class="ph ph-text-b text-lg"></i>
                    </button>
                    <button type="button" onclick="formatDoc('italic')" class="w-8 h-8 flex items-center justify-center rounded-md hover:bg-white hover:shadow-sm text-gray-600 transition" title="Italic">
                        <i class="ph ph-text-italic text-lg"></i>
                    </button>
                    <button type="button" onclick="formatDoc('underline')" class="w-8 h-8 flex items-center justify-center rounded-md hover:bg-white hover:shadow-sm text-gray-600 transition" title="Underline">
                        <i class="ph ph-text-underline text-lg"></i>
                    </button>
                </div>

                <div class="flex items-center gap-1 p-1 bg-gray-50 rounded-lg border border-gray-100">
                    <button type="button" onclick="formatDoc('formatBlock', 'h2')" class="w-8 h-8 flex items-center justify-center rounded-md hover:bg-white hover:shadow-sm text-gray-600 transition font-black" title="Heading 2">
                        H2
                    </button>
                    <button type="button" onclick="formatDoc('formatBlock', 'p')" class="w-8 h-8 flex items-center justify-center rounded-md hover:bg-white hover:shadow-sm text-gray-600 transition" title="Paragraph">
                        P
                    </button>
                </div>

                <div class="flex items-center gap-1 p-1 bg-gray-50 rounded-lg border border-gray-100">
                    <button type="button" onclick="formatDoc('insertUnorderedList')" class="w-8 h-8 flex items-center justify-center rounded-md hover:bg-white hover:shadow-sm text-gray-600 transition" title="Bullet List">
                        <i class="ph ph-list-bullets text-lg"></i>
                    </button>
                    <button type="button" onclick="formatDoc('insertOrderedList')" class="w-8 h-8 flex items-center justify-center rounded-md hover:bg-white hover:shadow-sm text-gray-600 transition" title="Numbered List">
                        <i class="ph ph-list-numbers text-lg"></i>
                    </button>
                </div>

                <div class="flex-1"></div>

                <button type="button" id="toggleModeBtn" onclick="toggleSourceMode()" class="flex items-center gap-2 px-4 py-2 rounded-lg text-xs font-bold uppercase tracking-wider bg-black text-white hover:bg-gray-800 transition shadow-lg">
                    <i class="ph ph-code text-lg"></i>
                    <span id="modeLabel">HTML Mode</span>
                </button>
            </div>

            <div class="relative min-h-[500px] bg-gray-50">
                
                <div id="visualEditor" contenteditable="true" class="absolute inset-0 p-8 outline-none overflow-y-auto prose max-w-none text-gray-700 bg-white">
                    {{ page.content | safe }}
                </div>

                <textarea name="content" id="htmlEditor" class="hidden absolute inset-0 w-full h-full p-8 font-mono text-sm bg-gray-900 text-green-400 outline-none resize-none leading-relaxed">{{ page.content }}</textarea>
            
            </div>

            <div class="p-6 bg-white border-t border-gray-100 flex justify-between items-center">
                <p class="text-[10px] text-gray-400 font-bold uppercase tracking-widest">
                    <i class="ph ph-info mr-1"></i> Changes auto-save to HTML on submit
                </p>
                <button type="submit" onclick="syncContentBeforeSubmit()" class="bg-blue-600 text-white px-8 py-3 rounded-xl font-bold uppercase tracking-widest hover:bg-blue-700 transition shadow-lg shadow-blue-200 flex items-center gap-2">
                    <i class="ph ph-floppy-disk text-lg"></i> Save Page
                </button>
            </div>
        </form>
    </div>
</div>

<script>
    // --- CORE EDITOR LOGIC ---
    let isHtmlMode = false;
    const visualEditor = document.getElementById('visualEditor');
    const htmlEditor = document.getElementById('htmlEditor');
    const toggleBtn = document.getElementById('toggleModeBtn');
    const modeLabel = document.getElementById('modeLabel');

    // 1. Execute Formatting Commands
    function formatDoc(cmd, value = null) {
        if(isHtmlMode) {
            alert("Switch back to Visual Mode to use toolbar buttons.");
            return;
        }
        document.execCommand(cmd, false, value);
        visualEditor.focus();
    }

    // 2. Toggle Between Visual and HTML Source
    function toggleSourceMode() {
        if (isHtmlMode) {
            // Switching TO Visual Mode
            visualEditor.innerHTML = htmlEditor.value;
            
            htmlEditor.classList.add('hidden');
            visualEditor.classList.remove('hidden');
            
            toggleBtn.classList.remove('bg-blue-600');
            toggleBtn.classList.add('bg-black');
            modeLabel.innerText = "HTML Mode";
            isHtmlMode = false;
        } else {
            // Switching TO HTML Mode
            htmlEditor.value = visualEditor.innerHTML;
            
            visualEditor.classList.add('hidden');
            htmlEditor.classList.remove('hidden');
            
            toggleBtn.classList.remove('bg-black');
            toggleBtn.classList.add('bg-blue-600');
            modeLabel.innerText = "Visual Mode";
            isHtmlMode = true;
        }
    }

    // 3. Sync Content Before Form Submit
    function syncContentBeforeSubmit() {
        // Ensure the textarea (which gets sent to server) has the latest data
        if (!isHtmlMode) {
            htmlEditor.value = visualEditor.innerHTML;
        }
    }

    // Optional: Paste cleanup to prevent messy Word styling
    visualEditor.addEventListener('paste', function(e) {
        e.preventDefault();
        var text = (e.originalEvent || e).clipboardData.getData('text/plain');
        document.execCommand("insertHTML", false, text);
    });
</script>

<style>
    /* Minimal Prose Styling for the Visual Editor to match Frontend */
    #visualEditor h2 { font-size: 1.5rem; font-weight: 700; color: #111827; margin-top: 1.5em; margin-bottom: 0.5em; }
    #visualEditor p { margin-bottom: 1em; line-height: 1.6; }
    #visualEditor ul { list-style-type: disc; padding-left: 1.5em; margin-bottom: 1em; }
    #visualEditor ol { list-style-type: decimal; padding-left: 1.5em; margin-bottom: 1em; }
    #visualEditor b, #visualEditor strong { font-weight: 700; }
    #visualEditor i, #visualEditor em { font-style: italic; }
    #visualEditor u { text-decoration: underline; }
</style>
{% endblock %}
