{% extends "admin/base.html" %}
{% block content %}
    <div class="flex justify-between items-center mb-6">
        <h2 class="text-2xl font-bold">Manage FAQs</h2>
    </div>

    <div class="bg-white p-6 rounded-xl shadow-sm border border-gray-200 mb-8">
        <h3 class="font-bold mb-4 text-sm uppercase text-gray-500">Add New FAQ</h3>
        <form method="POST" class="space-y-4" onsubmit="syncContent()">
            
            <div>
                <input type="text" name="question" placeholder="Question" required class="w-full p-3 border border-gray-200 rounded-lg focus:ring-2 focus:ring-black focus:outline-none font-medium">
            </div>

            <div class="border border-gray-200 rounded-lg overflow-hidden focus-within:ring-2 focus-within:ring-black transition">
                <div class="flex items-center gap-1 bg-gray-50 p-2 border-b border-gray-200 text-gray-600">
                    <button type="button" onclick="execCmd('bold')" class="p-2 rounded hover:bg-gray-200 hover:text-black transition" title="Bold">
                        <i class="ph ph-text-b"></i>
                    </button>
                    <button type="button" onclick="execCmd('italic')" class="p-2 rounded hover:bg-gray-200 hover:text-black transition" title="Italic">
                        <i class="ph ph-text-italic"></i>
                    </button>
                    <button type="button" onclick="execCmd('underline')" class="p-2 rounded hover:bg-gray-200 hover:text-black transition" title="Underline">
                        <i class="ph ph-text-underline"></i>
                    </button>
                    <div class="w-px h-4 bg-gray-300 mx-1"></div>
                    <button type="button" onclick="execCmd('insertUnorderedList')" class="p-2 rounded hover:bg-gray-200 hover:text-black transition" title="Bullet List">
                        <i class="ph ph-list-bullets"></i>
                    </button>
                    <button type="button" onclick="addLink()" class="p-2 rounded hover:bg-gray-200 hover:text-black transition" title="Add Link">
                        <i class="ph ph-link"></i>
                    </button>
                    <div class="flex-1"></div>
                    <button type="button" onclick="toggleSource()" class="p-2 rounded hover:bg-gray-200 hover:text-blue-600 transition flex items-center gap-2 text-xs font-bold uppercase" title="Edit HTML">
                        <i class="ph ph-code"></i> Source
                    </button>
                </div>

                <div id="visualEditor" contenteditable="true" class="p-4 min-h-[120px] outline-none text-gray-700 leading-relaxed"></div>
                
                <textarea id="htmlEditor" class="hidden w-full p-4 min-h-[120px] bg-gray-900 text-green-400 font-mono text-xs outline-none resize-y" oninput="syncVisual()"></textarea>
                
                <input type="hidden" name="answer" id="answerInput">
            </div>

            <button class="bg-black text-white px-6 py-2 rounded-lg font-bold hover:bg-gray-800 transition shadow-lg shadow-gray-200">
                <i class="ph ph-plus-circle mr-2"></i> Add FAQ
            </button>
        </form>
    </div>

    <div class="bg-white rounded-xl shadow-sm border border-gray-200 overflow-hidden">
        <table class="w-full text-left text-sm">
            <thead class="bg-gray-50 border-b">
                <tr>
                    <th class="p-4">Question</th>
                    <th class="p-4 w-32 text-center">Actions</th>
                </tr>
            </thead>
            <tbody class="divide-y">
                {% for faq in faqs %}
                <tr class="hover:bg-gray-50">
                    <td class="p-4">{{ faq.question }}</td>
                    <td class="p-4 flex gap-2 justify-center">
                        <a href="{{ url_for('edit_faq', id=faq.id) }}" class="p-2 text-blue-600 hover:bg-blue-50 rounded">
                            <i class="ph ph-pencil-simple"></i>
                        </a>
                        <a href="{{ url_for('delete_faq', id=faq.id) }}" onclick="return confirm('Delete?')" class="p-2 text-red-600 hover:bg-red-50 rounded">
                            <i class="ph ph-trash"></i>
                        </a>
                    </td>
                </tr>
                {% endfor %}
            </tbody>
        </table>
    </div>

    <script>
        function execCmd(command, value = null) {
            document.execCommand(command, false, value);
            // Ensure focus stays on editor
            document.getElementById('visualEditor').focus();
        }

        function addLink() {
            const url = prompt("Enter the URL:");
            if (url) execCmd('createLink', url);
        }

        function toggleSource() {
            const visual = document.getElementById('visualEditor');
            const html = document.getElementById('htmlEditor');
            
            if (html.classList.contains('hidden')) {
                // Switch to HTML Mode
                html.value = visual.innerHTML;
                visual.classList.add('hidden');
                html.classList.remove('hidden');
            } else {
                // Switch to Visual Mode
                visual.innerHTML = html.value;
                html.classList.add('hidden');
                visual.classList.remove('hidden');
            }
        }
        
        // Sync HTML changes back to visual when typing in Source mode
        function syncVisual() {
            document.getElementById('visualEditor').innerHTML = document.getElementById('htmlEditor').value;
        }

        // Before submitting, put the content into the hidden input
        function syncContent() {
            const visual = document.getElementById('visualEditor');
            const html = document.getElementById('htmlEditor');
            const input = document.getElementById('answerInput');
            
            // If we are in HTML mode, use that value, otherwise use Visual innerHTML
            if (!html.classList.contains('hidden')) {
                input.value = html.value;
            } else {
                input.value = visual.innerHTML;
            }
        }
    </script>
{% endblock %}
