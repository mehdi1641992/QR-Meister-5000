{% extends "admin/base.html" %}
{% block content %}
    <div class="max-w-6xl mx-auto">
        <h2 class="text-2xl font-bold mb-6">Master Configuration</h2>

        <form method="POST" enctype="multipart/form-data" class="grid grid-cols-1 lg:grid-cols-2 gap-8">

            <div class="space-y-6">
                <div class="bg-white p-6 rounded-xl shadow-sm border border-gray-200">
                    <h3 class="font-bold text-gray-900 mb-4 border-b pb-2">Branding & Footer</h3>
                    <div class="space-y-4">
                        <div>
                            <label class="block text-xs font-bold text-gray-500 uppercase mb-2">Website Name</label>
                            <input type="text" name="site_name" id="input_site_name" value="{{ config.site_name }}" class="w-full p-3 border rounded-lg" oninput="updatePreview()">
                        </div>
                        <div>
                            <label class="block text-xs font-bold text-gray-500 uppercase mb-2">Footer Text</label>
                            <input type="text" name="footer_text" id="input_footer" value="{{ config.footer_text }}" class="w-full p-3 border rounded-lg" oninput="updatePreview()">
                        </div>
                        <div>
                            <label class="block text-xs font-bold text-gray-500 uppercase mb-2">Favicon</label>
                            <div class="flex items-center gap-4">
                                <div class="w-10 h-10 border rounded flex items-center justify-center bg-gray-50 overflow-hidden">
                                    <img src="{{ url_for('static', filename='uploads/' + config.favicon) }}" class="max-w-full">
                                </div>
                                <input type="file" name="favicon" class="text-xs text-gray-500">
                            </div>
                        </div>
                    </div>
                </div>

                <div class="bg-white p-6 rounded-xl shadow-sm border border-gray-200">
                    <h3 class="font-bold text-gray-900 mb-4 border-b pb-2">Contact & Monetization</h3>
                    <div class="space-y-4">
                        <div>
                            <label class="block text-xs font-bold text-gray-500 uppercase mb-2">Support Email</label>
                            <input type="email" name="contact_email" value="{{ config.contact_email }}" class="w-full p-3 border rounded-lg" placeholder="contact@yoursite.com">
                        </div>
                        <div>
                            <label class="block text-xs font-bold text-gray-500 uppercase mb-2">WhatsApp Number (For Sales)</label>
                            <input type="text" name="whatsapp_number" value="{{ config.whatsapp_number }}" class="w-full p-3 border rounded-lg" placeholder="8801700000000">
                        </div>
                        <div>
                            <label class="block text-xs font-bold text-gray-500 uppercase mb-2">Payment Instructions (Shown on Upgrade Page)</label>
                            <textarea name="payment_instructions" rows="4" class="w-full p-3 border rounded-lg text-sm">{{ config.payment_instructions }}</textarea>
                        </div>
                    </div>
                </div>

                <div class="bg-white p-6 rounded-xl shadow-sm border border-gray-200">
                    <h3 class="font-bold text-gray-900 mb-4 border-b pb-2">Appearance</h3>
                    <div class="space-y-4">
                        <div>
                            <label class="block text-xs font-bold text-gray-500 uppercase mb-2">Font</label>
                            <select name="title_font" id="input_font" class="w-full p-3 border rounded-lg" onchange="updatePreview()">
                                <option value="Inter" {% if config.title_font == 'Inter' %}selected{% endif %}>Inter</option>
                                <option value="Press Start 2P" {% if config.title_font == 'Press Start 2P' %}selected{% endif %}>Press Start 2P</option>
                                <option value="Montserrat" {% if config.title_font == 'Montserrat' %}selected{% endif %}>Montserrat</option>
                                <option value="Playfair Display" {% if config.title_font == 'Playfair Display' %}selected{% endif %}>Playfair Display</option>
                            </select>
                        </div>
                        <div class="grid grid-cols-2 gap-4">
                            <div>
                                <label class="block text-xs font-bold text-gray-500 uppercase mb-2">Title Size</label>
                                <input type="number" name="title_font_size" id="input_size" value="{{ config.title_font_size }}" class="w-full p-3 border rounded-lg" oninput="updatePreview()">
                            </div>
                            <div>
                                <label class="block text-xs font-bold text-gray-500 uppercase mb-2">Title Color</label>
                                <input type="color" name="title_color" id="input_color" value="{{ config.title_color }}" class="w-full h-[50px] border rounded-lg cursor-pointer" oninput="updatePreview()">
                            </div>
                        </div>
                        <label class="flex items-center gap-3 p-3 bg-gray-50 rounded-lg cursor-pointer">
                            <input type="checkbox" name="dark_mode" id="input_dark_mode" class="w-5 h-5" {% if config.dark_mode %}checked{% endif %} onchange="updatePreview()">
                            <span class="text-sm font-bold">Enable Dark Mode</span>
                        </label>
                        <div class="flex items-center justify-between p-6 bg-red-50 rounded-2xl border border-red-100 mt-6">
                            <div class="flex items-center gap-4">
                                <div class="w-12 h-12 bg-red-100 text-red-600 rounded-xl flex items-center justify-center">
                                    <i class="ph ph-warning-octagon text-2xl"></i>
                                </div>
                                <div>
                                    <h4 class="font-black text-red-900 text-sm">Maintenance Mode</h4>
                                    <p class="text-xs text-red-700 font-medium">Block public access to the generator and solutions.</p>
                                </div>
                            </div>
                            <label class="relative inline-flex items-center cursor-pointer">
                                <input type="checkbox" name="maintenance_mode" class="sr-only peer" {{ 'checked' if config.maintenance_mode }}>
                                <div class="w-14 h-7 bg-gray-200 peer-focus:outline-none rounded-full peer peer-checked:after:translate-x-full peer-checked:after:border-white after:content-[''] after:absolute after:top-0.5 after:left-[4px] after:bg-white after:border-gray-300 after:border after:rounded-full after:h-6 after:w-6 after:transition-all peer-checked:bg-red-600"></div>
                            </label>
                        </div>
                    </div>
                </div>

                <button class="w-full bg-black text-white py-4 rounded-xl font-bold hover:bg-gray-800 transition shadow-xl">Apply Master Settings</button>
            </div>

            <div class="sticky top-6">
                 </div>
        </form>
    </div>
<script>
        // Load fonts for preview
        const fonts = ['Inter', 'Press Start 2P', 'Montserrat', 'Playfair Display'];
        fonts.forEach(font => {
            const link = document.createElement('link');
            link.href = `https://fonts.googleapis.com/css2?family=${font.replace(/ /g, '+')}&display=swap`;
            link.rel = 'stylesheet';
            document.head.appendChild(link);
        });

        function updatePreview() {
            const name = document.getElementById('input_site_name').value;
            const footer = document.getElementById('input_footer').value;
            const font = document.getElementById('input_font').value;
            const size = document.getElementById('input_size').value;
            const color = document.getElementById('input_color').value;
            const isDark = document.getElementById('input_dark_mode').checked;

            const title = document.getElementById('preview_title');
            const footerEl = document.getElementById('preview_footer');
            const body = document.getElementById('preview_body');
            const card = document.getElementById('preview_card');

            // Branding Update
            title.innerText = name || 'Your Brand';
            footerEl.innerText = footer || '© 2025 Your Site';

            // Style Update
            title.style.fontFamily = `'${font}', sans-serif`;
            title.style.fontSize = `${size}px`;
            title.style.color = color;

            // Dark Mode Toggle
            if (isDark) {
                body.classList.remove('bg-[#f3f4f6]');
                body.classList.add('bg-gray-900');
                card.classList.add('bg-gray-800', 'border-gray-700');
                footerEl.classList.replace('text-gray-400', 'text-gray-600');
            } else {
                body.classList.add('bg-[#f3f4f6]');
                body.classList.remove('bg-gray-900');
                card.classList.remove('bg-gray-800', 'border-gray-700');
                footerEl.classList.replace('text-gray-600', 'text-gray-400');
            }
        }

        // Initialize preview on load
        window.onload = updatePreview;
    </script>
{% endblock %}
