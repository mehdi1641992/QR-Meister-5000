<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ user.username }} | Connect</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/@phosphor-icons/web"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&display=swap');
        body { font-family: 'Inter', sans-serif; }
        .glass { background: rgba(255, 255, 255, 0.8); backdrop-filter: blur(10px); }
    </style>
</head>
<body class="bg-gradient-to-b from-gray-50 to-gray-200 min-h-screen p-6 flex flex-col items-center">

    <div class="max-w-md w-full mt-12 text-center">
        <div class="w-24 h-24 bg-black rounded-full mx-auto flex items-center justify-center text-white text-3xl font-black mb-4 shadow-xl border-4 border-white">
            {{ user.username[0]|upper }}
        </div>
        
        <h1 class="text-2xl font-black text-gray-900 tracking-tight">@{{ user.username }}</h1>
        <p class="text-gray-500 text-sm mb-8">Pro Member • {{ config.site_name }}</p>

        <div class="space-y-4">
            {% for link in links %}
            <a href="{{ link.target_url }}" target="_blank" class="glass w-full p-4 rounded-2xl flex items-center justify-between border border-white hover:scale-[1.02] transition shadow-sm group">
                <div class="flex items-center gap-3">
                    <div class="w-10 h-10 bg-gray-900 text-white rounded-xl flex items-center justify-center">
                        <i class="ph ph-link-simple-bold text-lg"></i>
                    </div>
                    <span class="font-bold text-gray-800">{{ link.name }}</span>
                </div>
                <i class="ph ph-caret-right text-gray-400 group-hover:translate-x-1 transition"></i>
            </a>
            {% endfor %}
            
            <a href="https://wa.me/{{ config.whatsapp_number }}" class="glass w-full p-4 rounded-2xl flex items-center justify-between border border-white hover:scale-[1.02] transition shadow-sm group">
                <div class="flex items-center gap-3">
                    <div class="w-10 h-10 bg-green-500 text-white rounded-xl flex items-center justify-center">
                        <i class="ph ph-whatsapp-logo text-lg"></i>
                    </div>
                    <span class="font-bold text-gray-800">Message Me</span>
                </div>
                <i class="ph ph-caret-right text-gray-400"></i>
            </a>
        </div>

        <footer class="mt-20">
            <p class="text-[10px] font-black text-gray-400 uppercase tracking-widest">{{ config.footer_text }}</p>
        </footer>
    </div>

</body>
</html>
