<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact — {{ config.site_name }}</title>
    <link rel="icon" href="{{ url_for('static', filename='uploads/' + config.favicon) }}">
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/@phosphor-icons/web"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800;900&display=swap');
        body { font-family: 'Inter', sans-serif; }
        .glass-card { 
            background: {{ 'rgba(17, 24, 39, 0.8)' if config.dark_mode else 'rgba(255, 255, 255, 1)' }};
            backdrop-filter: blur(12px);
        }
    </style>
</head>
<body class="min-h-screen flex flex-col items-center justify-center p-6 transition-colors duration-500 {{ 'bg-gray-950' if config.dark_mode else 'bg-[#f3f4f6]' }}">

    <div class="w-full max-w-md">
        <a href="{{ url_for('index') }}" class="inline-flex items-center gap-2 text-xs font-black text-gray-400 hover:text-blue-500 transition mb-8 uppercase tracking-widest group">
            <i class="ph ph-arrow-left transition-transform group-hover:-translate-x-1"></i> Back to Home
        </a>

        <div class="glass-card p-10 rounded-[3rem] shadow-2xl border {{ 'border-gray-800' if config.dark_mode else 'border-white' }}">
            <div class="text-center mb-10">
                <div class="w-16 h-16 {{ 'bg-blue-500/10 text-blue-400' if config.dark_mode else 'bg-blue-50 text-blue-600' }} rounded-2xl flex items-center justify-center mx-auto mb-6">
                    <i class="ph ph-chat-circle-dots text-3xl"></i>
                </div>
                <h1 class="text-3xl font-black tracking-tighter {{ 'text-white' if config.dark_mode else 'text-gray-900' }}">Get in Touch</h1>
                <p class="text-sm mt-3 leading-relaxed {{ 'text-gray-500' if config.dark_mode else 'text-gray-500' }}">
                    Have a technical issue or custom request? Our team is ready to assist.
                </p>
            </div>

            <form id="contactForm" class="space-y-6">
                <div>
                    <label class="block text-[10px] font-black uppercase tracking-[0.2em] mb-3 ml-1 {{ 'text-gray-500' if config.dark_mode else 'text-gray-400' }}">Full Name</label>
                    <input type="text" id="contact_name" required placeholder="John Doe" 
                        class="w-full p-4 rounded-2xl outline-none transition-all {{ 'bg-gray-900 border-gray-800 text-white focus:border-blue-500' if config.dark_mode else 'bg-gray-50 border-gray-100 text-gray-900 focus:bg-white focus:ring-4 focus:ring-blue-50/50' }} border">
                </div>

                <div>
                    <label class="block text-[10px] font-black uppercase tracking-[0.2em] mb-3 ml-1 {{ 'text-gray-500' if config.dark_mode else 'text-gray-400' }}">Message</label>
                    <textarea id="contact_message" rows="4" required placeholder="Describe your inquiry..." 
                        class="w-full p-4 rounded-2xl outline-none transition-all resize-none {{ 'bg-gray-900 border-gray-800 text-white focus:border-blue-500' if config.dark_mode else 'bg-gray-50 border-gray-100 text-gray-900 focus:bg-white focus:ring-4 focus:ring-blue-50/50' }} border"></textarea>
                </div>

                <button type="button" onclick="sendMail()" 
                    class="w-full bg-black text-white p-5 rounded-2xl font-black hover:scale-[1.02] active:scale-[0.98] transition-all shadow-xl {{ 'shadow-blue-500/5 bg-blue-600 hover:bg-blue-500' if config.dark_mode else 'shadow-gray-200' }} flex items-center justify-center gap-3">
                    Submit Inquiry <i class="ph ph-paper-plane-tilt text-xl"></i>
                </button>
            </form>
        </div>

        <div class="mt-12 flex justify-center gap-10">
            <a href="https://wa.me/{{ config.whatsapp_number }}" target="_blank" class="flex flex-col items-center gap-3 group">
                <div class="w-14 h-14 rounded-2xl shadow-sm flex items-center justify-center transition-all group-hover:scale-110 {{ 'bg-gray-900 text-gray-500 group-hover:text-green-400' if config.dark_mode else 'bg-white text-gray-400 group-hover:text-green-500' }}">
                    <i class="ph ph-whatsapp-logo text-3xl"></i>
                </div>
                <span class="text-[10px] font-black uppercase tracking-widest text-gray-500">WhatsApp</span>
            </a>
            <a href="mailto:{{ config.contact_email }}" class="flex flex-col items-center gap-3 group">
                <div class="w-14 h-14 rounded-2xl shadow-sm flex items-center justify-center transition-all group-hover:scale-110 {{ 'bg-gray-900 text-gray-500 group-hover:text-blue-400' if config.dark_mode else 'bg-white text-gray-400 group-hover:text-blue-500' }}">
                    <i class="ph ph-envelope-simple text-3xl"></i>
                </div>
                <span class="text-[10px] font-black uppercase tracking-widest text-gray-500">Email</span>
            </a>
        </div>
    </div>

    <script>
        function sendMail() {
            const name = document.getElementById('contact_name').value;
            const message = document.getElementById('contact_message').value;
            const email = "{{ config.contact_email }}";
            const site = "{{ config.site_name }}";

            if (!name || !message) {
                alert("Please complete the form.");
                return;
            }

            const subject = encodeURIComponent(`Support Inquiry: ${name} | ${site}`);
            const body = encodeURIComponent(`Inquiry from: ${name}\n\nClient Message:\n${message}\n\n--- Sent via ${site} Support Portal ---`);
            
            window.location.href = `mailto:${email}?subject=${subject}&body=${body}`;
        }
    </script>
</body>
</html>
