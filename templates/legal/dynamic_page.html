<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ page.title }} - {{ config.site_name }}</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/@phosphor-icons/web"></script>
    <style> 
        body { font-family: 'Inter', sans-serif; } 
        /* Basic Typography for the content */
        .prose h1 { font-size: 1.5rem; font-weight: 700; margin-bottom: 0.5rem; margin-top: 1.5rem; }
        .prose h2 { font-size: 1.25rem; font-weight: 600; margin-bottom: 0.5rem; margin-top: 1.25rem; }
        .prose p { margin-bottom: 1rem; line-height: 1.6; }
        .prose ul { list-style-type: disc; padding-left: 1.5rem; margin-bottom: 1rem; }
    </style>
</head>
<body class="min-h-screen py-10 px-4 {{ 'bg-gray-900 text-gray-300' if config.dark_mode else 'bg-gray-50 text-gray-700' }}">

    <div class="max-w-3xl mx-auto bg-white/5 p-8 md:p-12 rounded-3xl shadow-xl {{ 'bg-gray-800' if config.dark_mode else 'bg-white' }}">
        
        <div class="mb-10 border-b pb-6 {{ 'border-gray-700' if config.dark_mode else 'border-gray-200' }}">
            <a href="{{ url_for('index') }}" class="flex items-center gap-2 text-xs font-bold uppercase tracking-widest mb-4 hover:text-blue-500 transition">
                <i class="ph ph-arrow-left"></i> Back to Generator
            </a>
            <h1 class="text-3xl font-black tracking-tight {{ 'text-white' if config.dark_mode else 'text-gray-900' }}">{{ page.title }}</h1>
            <p class="text-xs font-bold uppercase tracking-widest mt-2 opacity-50">Last Updated: {{ page.updated_at.strftime('%Y-%m-%d') }}</p>
        </div>

        <div class="prose max-w-none text-sm leading-relaxed {{ 'text-gray-300' if config.dark_mode else 'text-gray-600' }}">
            {{ page.content | safe }}
        </div>

        <div class="mt-12 pt-6 border-t text-center text-xs font-bold uppercase tracking-widest opacity-50 {{ 'border-gray-700' if config.dark_mode else 'border-gray-200' }}">
            &copy; {{ config.site_name }}. All Rights Reserved.
        </div>
    </div>

</body>
</html>
