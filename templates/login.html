<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Login</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/@phosphor-icons/web"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap');
        body { font-family: 'Inter', sans-serif; }
    </style>
</head>
<body class="bg-gray-50 h-screen flex items-center justify-center p-4">
    
    <div class="w-full max-w-sm">
        
        {% with messages = get_flashed_messages() %}
            {% if messages %}
                <div class="mb-4 p-3 bg-red-100 text-red-700 text-sm rounded-lg border border-red-200 text-center">
                    {{ messages[0] }}
                </div>
            {% endif %}
        {% endwith %}

        <div class="bg-white p-8 rounded-2xl shadow-xl shadow-gray-200/50 border border-gray-100">
            <div class="text-center mb-8">
                <div class="w-12 h-12 bg-black text-white rounded-xl flex items-center justify-center mx-auto mb-4">
                    <i class="ph ph-lock-key text-2xl"></i>
                </div>
                <h2 class="text-xl font-bold text-gray-900 tracking-tight">Admin Portal</h2>
                <p class="text-sm text-gray-500 mt-1">Please sign in to continue</p>
            </div>

            <form method="POST" action="{{ url_for('login') }}" class="space-y-4">
                <div>
                    <label class="block text-xs font-bold text-gray-500 uppercase mb-2">Username</label>
                    <input type="text" name="username" placeholder="admin" required class="w-full p-3 bg-gray-50 border border-gray-200 rounded-lg focus:outline-none focus:ring-2 focus:ring-black focus:bg-white transition">
                </div>
                
                <div>
                    <label class="block text-xs font-bold text-gray-500 uppercase mb-2">Password</label>
                    <input type="password" name="password" placeholder="••••••••" required class="w-full p-3 bg-gray-50 border border-gray-200 rounded-lg focus:outline-none focus:ring-2 focus:ring-black focus:bg-white transition">
                </div>

                <button class="w-full bg-black text-white p-3 rounded-lg font-bold hover:bg-gray-800 transition shadow-lg shadow-gray-200 flex items-center justify-center gap-2">
                    Sign In <i class="ph ph-arrow-right"></i>
                </button>
            </form>
        </div>
        
        <p class="text-center text-gray-400 text-xs mt-6">Secure Access Only</p>
    </div>

</body>
</html>
